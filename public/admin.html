<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J Rides — Operator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0E12; --muted:#5c6358; --line:#d8d5cc; --paper:#EDEBE6; --accent:#C6FF3D; --danger:#b42318;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:'DM Sans',sans-serif; color:var(--ink);
    background: radial-gradient(ellipse 70% 40% at 10% -10%, rgba(198,255,61,.18), transparent 55%), var(--paper);
    padding:28px 16px 64px; line-height:1.5;
  }
  main{ max-width:820px; margin:0 auto; }
  h1{ font-family:'Space Grotesk',sans-serif; letter-spacing:-.03em; margin:0 0 6px; font-size:clamp(24px,4vw,32px); }
  .sub{ color:var(--muted); margin:0 0 22px; font-size:14px; }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px;
  }
  .card h2{
    font-family:'Space Grotesk',sans-serif; font-size:13px; letter-spacing:.08em; text-transform:uppercase;
    margin:0 0 12px; color:#6b6b6b;
  }
  label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  input[type=password], input[type=text]{
    width:100%; max-width:420px; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    font:inherit; margin-bottom:10px;
  }
  .row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button, .btn{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; letter-spacing:.03em;
    border:1px solid var(--ink); background:var(--ink); color:#F5F6F3; border-radius:999px;
    padding:9px 14px; cursor:pointer;
  }
  button.secondary{ background:#fff; color:var(--ink); }
  button.danger{ background:var(--danger); border-color:var(--danger); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:999px; background:#F5F4F0; border:1px solid var(--line);
  }
  .pill.on{ background:var(--accent); border-color:transparent; }
  .pill.off{ color:#8a8a8a; }
  .booking{
    border-top:1px solid var(--line); padding:12px 0; display:grid; gap:6px;
  }
  .booking:first-of-type{ border-top:none; }
  .booking .meta{ font-size:13px; color:var(--muted); }
  .booking strong{ font-family:'Space Grotesk',sans-serif; }
  .msg{ font-size:13px; color:var(--muted); margin-top:8px; white-space:pre-wrap; }
  .msg.err{ color:var(--danger); }
  .hidden{ display:none; }
</style>
</head>
<body>
<main>
  <h1>Operator</h1>
  <p class="sub">Payment alerts · refunds · payouts to your bank</p>

  <section class="card" id="loginCard">
    <h2>Access</h2>
    <label for="token">Admin token</label>
    <input id="token" type="password" autocomplete="current-password" placeholder="Paste ADMIN_TOKEN">
    <div class="row">
      <button type="button" id="saveToken">Unlock</button>
    </div>
    <p class="msg" id="loginMsg"></p>
  </section>

  <div id="app" class="hidden">
    <section class="card">
      <h2>Status</h2>
      <div class="row" id="statusPills"></div>
      <div class="row" style="margin-top:12px">
        <button type="button" class="secondary" id="btnSetup">Connect Stripe webhook</button>
        <button type="button" class="secondary" id="btnRecreate">Recreate webhook</button>
        <button type="button" class="secondary" id="btnTest">Send test alert</button>
        <button type="button" class="secondary" id="btnRefresh">Refresh</button>
      </div>
      <p class="msg" id="statusMsg"></p>
    </section>

    <section class="card">
      <h2>Bank payouts</h2>
      <div id="payoutInfo" class="meta"></div>
      <div class="row" style="margin-top:12px">
        <button type="button" id="btnPayout">Pay out available balance</button>
      </div>
      <p class="msg" id="payoutMsg"></p>
    </section>

    <section class="card">
      <h2>Recent bookings</h2>
      <div id="bookings"></div>
      <p class="msg" id="bookingsMsg"></p>
    </section>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const tokenKey = 'jrides_admin_token';

  function token(){ return localStorage.getItem(tokenKey) || ''; }
  function authHeaders(){
    return { 'authorization': 'Bearer ' + token(), 'content-type': 'application/json' };
  }

  async function api(path, opts = {}){
    const res = await fetch(path, { ...opts, headers: { ...authHeaders(), ...(opts.headers || {}) } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || data.error || ('HTTP ' + res.status));
    return data;
  }

  function pill(label, on){
    return `<span class="pill ${on ? 'on' : 'off'}">${label}: ${on ? 'on' : 'off'}</span>`;
  }

  async function loadStatus(){
    const s = await api('/api/admin/status');
    $('statusPills').innerHTML = [
      pill('Stripe', s.stripe),
      pill('Webhook', s.stripeWebhook),
      pill('Push/ntfy', s.notify.webhook),
      pill('SMS', s.notify.sms),
      pill('Email', s.notify.email),
    ].join('');
    return s;
  }

  async function loadPayouts(){
    const p = await api('/api/admin/payouts');
    const avail = (p.available || []).map(a => `$${a.amount} ${a.currency.toUpperCase()}`).join(', ') || '$0';
    const pend = (p.pending || []).map(a => `$${a.amount} ${a.currency.toUpperCase()}`).join(', ') || '$0';
    const recent = (p.payouts || []).slice(0,5).map(x =>
      `• $${x.amount} · ${x.status} · ${x.method}${x.automatic ? ' (auto)' : ''}`
    ).join('<br>');
    $('payoutInfo').innerHTML =
      `<strong>Available:</strong> ${avail}<br><strong>Pending:</strong> ${pend}<br><br>${recent || 'No payouts yet.'}<br><span style="color:#8a8a8a">${p.note || ''}</span>`;
  }

  async function loadBookings(){
    const data = await api('/api/admin/bookings');
    const el = $('bookings');
    if (!data.bookings.length){
      el.innerHTML = '<p class="msg">No checkout sessions yet.</p>';
      return;
    }
    el.innerHTML = data.bookings.map(b => {
      const when = b.created ? new Date(b.created * 1000).toLocaleString() : '';
      const route = [b.pickup, b.dropoff].filter(Boolean).join(' → ') || '—';
      const canRefund = b.paymentStatus === 'paid' && b.paymentIntentId && !b.refunded;
      return `<div class="booking">
        <div><strong>$${b.amount || '—'}</strong> · ${b.paymentStatus}${b.refunded ? ' · refunded $' + b.amountRefunded : ''}</div>
        <div class="meta">${b.name || 'Rider'} · ${b.phone || '—'} · ${b.when || ''}</div>
        <div class="meta">${route}</div>
        <div class="meta">${when}</div>
        <div class="row" style="margin-top:6px">
          ${canRefund ? `<button type="button" class="danger" data-refund="${b.paymentIntentId}">Refund</button>` : ''}
        </div>
      </div>`;
    }).join('');

    el.querySelectorAll('[data-refund]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Refund this payment in full?')) return;
        btn.disabled = true;
        try {
          const r = await api('/api/admin/refund', {
            method: 'POST',
            body: JSON.stringify({ paymentIntentId: btn.dataset.refund }),
          });
          $('bookingsMsg').textContent = `Refunded $${r.amount} (${r.status})`;
          await loadBookings();
        } catch (e) {
          $('bookingsMsg').textContent = e.message;
          $('bookingsMsg').className = 'msg err';
          btn.disabled = false;
        }
      });
    });
  }

  async function unlock(){
    const t = $('token').value.trim();
    if (!t) return;
    localStorage.setItem(tokenKey, t);
    try {
      await loadAll();
      $('loginCard').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('loginMsg').textContent = '';
    } catch (e) {
      localStorage.removeItem(tokenKey);
      $('loginMsg').textContent = e.message;
      $('loginMsg').className = 'msg err';
    }
  }

  async function loadAll(){
    await loadStatus();
    await loadPayouts();
    await loadBookings();
  }

  $('saveToken').addEventListener('click', unlock);
  $('token').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });

  $('btnSetup').addEventListener('click', async () => {
    $('statusMsg').textContent = 'Connecting…';
    try {
      const r = await api('/api/admin/setup-webhook', { method: 'POST', body: '{}' });
      $('statusMsg').textContent = r.note || 'Done.';
      await loadStatus();
    } catch (e) {
      $('statusMsg').textContent = e.message;
      $('statusMsg').className = 'msg err';
    }
  });

  $('btnRecreate').addEventListener('click', async () => {
    if (!confirm('Delete and recreate Stripe webhooks? (needed if secret was never stored)')) return;
    try {
      const r = await api('/api/admin/recreate-webhook', { method: 'POST', body: '{}' });
      $('statusMsg').textContent = r.ok ? 'Webhook recreated + secret stored.' : 'Done.';
      await loadStatus();
    } catch (e) {
      $('statusMsg').textContent = e.message;
      $('statusMsg').className = 'msg err';
    }
  });

  $('btnTest').addEventListener('click', async () => {
    try {
      const r = await api('/api/admin/test-notify', { method: 'POST', body: '{}' });
      $('statusMsg').textContent = r.sent
        ? 'Test sent via: ' + r.channels.join(', ')
        : 'No notify channel responded. Check ntfy/SMS/email secrets.';
    } catch (e) {
      $('statusMsg').textContent = e.message;
      $('statusMsg').className = 'msg err';
    }
  });

  $('btnRefresh').addEventListener('click', () => loadAll().catch(e => {
    $('statusMsg').textContent = e.message;
    $('statusMsg').className = 'msg err';
  }));

  $('btnPayout').addEventListener('click', async () => {
    if (!confirm('Send available Stripe balance to your bank?')) return;
    $('payoutMsg').textContent = 'Creating payout…';
    try {
      const r = await api('/api/admin/payout', { method: 'POST', body: '{}' });
      $('payoutMsg').textContent = `Payout $${r.amount} · ${r.method} · ${r.status}` +
        (r.fallback ? ' (instant unsupported — used standard)' : '');
      await loadPayouts();
    } catch (e) {
      $('payoutMsg').textContent = e.message;
      $('payoutMsg').className = 'msg err';
    }
  });

  if (token()) {
    $('token').value = token();
    unlock();
  }
</script>

</html>
