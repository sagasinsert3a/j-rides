name = "j-rides"
main = "src/index.js"
compatibility_date = "2024-08-01"

[assets]
directory = "public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "CONFIG"
id = "REPLACE_WITH_KV_ID"

[vars]
SITE_URL = "https://j-rides.vip"
BOOKING_PHONE = "+13238189982"
NOTIFY_EMAIL = "j@j-ser.com"
NOTIFY_FROM_EMAIL = "bookings@j-rides.vip"
MIN_LEAD_MINUTES = "120"
TIMEZONE = "America/Chicago"

[triggers]
crons = ["*/15 * * * *"]

[[send_email]]
name = "EMAIL"
remote = true
